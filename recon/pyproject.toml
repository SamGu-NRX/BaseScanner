[project]
name = "house-scanning-recon"
version = "0.1.0"
description = "Reconstruction worker: a scan bundle's photos and poses into a 3D model, wall and ground geometry, occlusion-aware coverage and an updated scene.json"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10,<5",
    "scipy>=1.14",
    "scikit-image>=0.24",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
required-version = ">=0.11.15,<0.12"
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
