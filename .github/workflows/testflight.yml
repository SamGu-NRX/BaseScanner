name: TestFlight

# Run by hand from the Actions tab. Never add pull_request or push triggers: this job holds an
# Admin App Store Connect key that can sign and upload builds for the whole team. The testflight
# environment only admits main and waits for a required reviewer before any secret is released.
#
# Key handling: secrets reach only the steps that use them, through step-level env. Each step
# that runs xcodebuild with the key decodes it into its own private directory and deletes it on
# exit, so no key exists between steps and no key path crosses a step boundary. Nothing prints
# the key, and no step uploads artifacts, caches or logs. Before any key exists, "Check build
# inputs" refuses projects that could run repository code during the signed build.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to archive and upload
        type: choice
        options:
          - house-scan
          - measure-lab
        default: house-scan

permissions:
  contents: read

# One upload at a time across both apps; a second run waits instead of cancelling the first.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Upload ${{ inputs.app }} to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    # Holds ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (secrets) and APPLE_TEAM_ID, BUNDLE_ID_PREFIX
    # (variables). CONTRIBUTING.md > Distribution lists the setup.
    environment: testflight
    env:
      # Same toolchain as .github/workflows/ios.yml; change both together.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      APP: ${{ inputs.app }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
      # <run number>.<attempt>, such as 12.1. GitHub counts runs per workflow, so both apps share
      # one increasing number, and a rerun gets a new attempt instead of a duplicate App Store
      # Connect rejects. CFBundleVersion allows up to three dot-separated integers.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      # Tests only whether each value is empty; it never prints one.
      - name: Check secrets and variables
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it to the 'testflight' environment (Settings > Environments). See CONTRIBUTING.md > Distribution."
              missing=1
            fi
          done
          for name in APPLE_TEAM_ID BUNDLE_ID_PREFIX; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is empty. Add it to the 'testflight' environment (Settings > Environments). See CONTRIBUTING.md > Distribution."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if ! [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Team ID from developer.apple.com > Membership details."
            exit 1
          fi
          if ! [[ "$BUNDLE_ID_PREFIX" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::BUNDLE_ID_PREFIX must be reverse-DNS, such as com.example.team."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select project
        run: |
          case "$APP" in
            house-scan)  dir=ios;                     name=HouseScan;  packages="" ;;
            measure-lab) dir=experiments/measure-lab; name=MeasureLab; packages="Geometry" ;;
            *) echo "::error::Unknown app '$APP'."; exit 1 ;;
          esac
          if [ ! -f "$dir/project.yml" ]; then
            echo "::error::$dir/project.yml is not on $GITHUB_REF_NAME. Run the workflow from a branch that contains $APP."
            exit 1
          fi
          {
            echo "PROJECT_DIR=$dir"
            echo "PROJECT_NAME=$name"
            echo "ALLOWED_LOCAL_PACKAGES=$packages"
          } >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Pick an installed Xcode from the image readme."
            exit 1
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # The build CI for each app fails on drift between project.yml and the committed project,
      # so generating here only guards against a branch that skipped that check.
      - name: Generate project
        run: xcodegen generate --spec "$PROJECT_DIR/project.yml"

      # Code from the repository must not run while the key is on disk. Build-script phases, build
      # rules, scheme pre/post actions, package plugins, macros and compiler plugins all run during
      # xcodebuild, so any of them fails the run here. The only package allowed is an in-repo one
      # named in ALLOWED_LOCAL_PACKAGES (set in "Select project") whose manifest declares no
      # dependencies, plugins, macros, binary targets or unsafe flags. SwiftPM still evaluates that
      # manifest in its macOS sandbox, which is why its contents are checked too.
      - name: Check build inputs
        run: |
          spec="$PROJECT_DIR/project.yml"
          pbx="$PROJECT_DIR/$PROJECT_NAME.xcodeproj/project.pbxproj"
          failed=0
          refuse() {
            echo "::error file=$1::$2 The TestFlight job refuses anything that runs repository code while the signing key exists. See CONTRIBUTING.md > Distribution."
            failed=1
          }
          flag() { # flag <file> <extended regex> <description>; an unreadable file also fails
            local rc=0
            grep -nE -- "$2" "$1" > "$RUNNER_TEMP/guard-hits" || rc=$?
            case "$rc" in
              0) refuse "$1" "$3 found at line(s) $(cut -d: -f1 "$RUNNER_TEMP/guard-hits" | paste -sd, -)." ;;
              1) ;;
              *) refuse "$1" "Could not read this file to check it." ;;
            esac
          }
          flag "$spec" '^[[:space:]]*(preBuildScripts|postCompileScripts|postBuildScripts|buildToolPlugins|buildRules|preActions|postActions|projectReferences):' "Build script, build rule, scheme action, plugin or project reference"
          flag "$pbx" 'PBXShellScriptBuildPhase|PBXBuildRule|XCRemoteSwiftPackageReference|wrapper\.pb-project|productName = "?plugin:' "Shell script phase, build rule, remote package, plugin or nested project"
          if [ -z "$ALLOWED_LOCAL_PACKAGES" ]; then
            flag "$spec" '^packages:' "Swift package section"
            flag "$pbx" 'XCLocalSwiftPackageReference|XCSwiftPackageProductDependency' "Swift package dependency"
          else
            declared="$(grep -c 'isa = XCLocalSwiftPackageReference;' "$pbx" || true)"
            refs="$(sed -nE 's/^[[:space:]]*relativePath = "?([^";]*)"?;/\1/p' "$pbx")"
            if [ "$declared" -ne "$(printf '%s' "$refs" | grep -c . || true)" ]; then
              refuse "$pbx" "Could not match every local package reference to a relativePath."
            fi
            for ref in $refs; do
              case " $ALLOWED_LOCAL_PACKAGES " in
                *" $ref "*) ;;
                *) refuse "$pbx" "Local package '$ref' is not in ALLOWED_LOCAL_PACKAGES." ;;
              esac
            done
            for pkg in $ALLOWED_LOCAL_PACKAGES; do
              flag "$PROJECT_DIR/$pkg/Package.swift" '\.package\(|\.plugin\(|plugins:|\.macro\(|CompilerPluginSupport|\.binaryTarget\(|unsafeFlags' "Package dependency, plugin, macro, binary target or unsafe flag in $pkg/Package.swift"
            done
          fi
          while IFS= read -r file; do
            flag "$file" 'load-plugin|plugin-path' "Swift compiler plugin flag"
          done < <(find "$PROJECT_DIR" -name '*.xcconfig' -o -name project.yml -o -name project.pbxproj)
          while IFS= read -r scheme; do
            flag "$scheme" 'ExecutionAction' "Scheme pre- or post-action"
          done < <(find "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" -name '*.xcscheme')
          while IFS= read -r resolved; do
            refuse "$resolved" "Package.resolved means the project pins external packages."
          done < <(find "$PROJECT_DIR" -name Package.resolved)
          rm -f "$RUNNER_TEMP/guard-hits"
          [ "$failed" -eq 0 ] || exit 1
          echo "No build scripts, build rules, scheme actions, plugins, macros or external packages in $PROJECT_DIR."

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # The key lives only in this step. GitHub masks the base64 secret in logs but not the
          # decoded file, so nothing may print it; base64 and grep -q write nothing to the log.
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/asc-key.XXXXXX")"
          # EXIT deletes the key on success and failure. INT and TERM exit through it, so a cancelled
          # step also fails instead of resuming after the handler.
          trap 'rm -rf "$keydir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          key="$keydir/AuthKey_${ASC_KEY_ID}.p8"
          if ! printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key" 2>/dev/null \
            || ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is not a base64-encoded .p8 file. See CONTRIBUTING.md > Distribution."
            exit 1
          fi
          umask 022
          xcodebuild archive \
            -project "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # destination=upload makes -exportArchive send the signed build to App Store Connect instead
      # of writing an .ipa. manageAppVersionAndBuildNumber=false keeps the run number as the build.
      - name: Export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$plist"
          # The key lives only in this step. GitHub masks the base64 secret in logs but not the
          # decoded file, so nothing may print it; base64 and grep -q write nothing to the log.
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/asc-key.XXXXXX")"
          # EXIT deletes the key on success and failure. INT and TERM exit through it, so a cancelled
          # step also fails instead of resuming after the handler.
          trap 'rm -rf "$keydir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          key="$keydir/AuthKey_${ASC_KEY_ID}.p8"
          if ! printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key" 2>/dev/null \
            || ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is not a base64-encoded .p8 file. See CONTRIBUTING.md > Distribution."
            exit 1
          fi
          umask 022
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded $PROJECT_NAME build $BUILD_NUMBER. It appears in TestFlight after App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"

      # Fallback only: each key step's trap already removed its directory. A runner killed without
      # a chance to run steps leaves cleanup to GitHub destroying the hosted runner.
      - name: Remove App Store Connect key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/asc-key.*
