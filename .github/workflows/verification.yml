name: Verification

on:
  push:
    branches: [main]
    paths:
      - "verification/**"
      - ".github/workflows/verification.yml"
  pull_request:
    paths:
      - "verification/**"
      - ".github/workflows/verification.yml"

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification-checks:
    name: Verification checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: verification
    steps:
      # The default depth of 1 is enough: tests/test_gitref.py only reads HEAD, and a detached
      # worktree of HEAD works in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads tool.uv.required-version from verification/pyproject.toml to pick the uv version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: verification
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
