<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 922" width="880" height="922" role="img" aria-labelledby="t d">
<title id="t">House scanning architecture</title>
<desc id="d">On the iPhone: find the meter, walk the wall, mark what is near, and send the capture. The phone posts scene.json to the server, and the full packet can go to the reconstruction worker, which rebuilds the wall and posts a rebuilt scene.json. The server checks every spot along the wall and returns PASS, FAIL or UNSURE. The phone shows the spot in AR, pinned to the meter. An UNSURE check sends the homeowner back to walk the wall for one more view.</desc>
<defs><style>
.title,.desc,.glabel{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.title{font-size:16px;font-weight:600;fill:#1f2328}
.desc{font-size:13px;fill:#59636e}
.meta,.gmeta{fill:#818b98}
.num{font-weight:700;font-size:12px}
.glabel{font-size:11.5px;font-weight:700;letter-spacing:.12em}
.cbg{fill:#ffffff;stroke:#d1d9e0;stroke-width:1;filter:url(#shadow)}
.phone{--a:#0969da}.server{--a:#bc4c00}.rules{--a:#8250df}.result{--a:#1a7f37}
.pass{--a:#1a7f37}.fail{--a:#cf222e}.unsure{--a:#9a6700}
.group rect{fill:var(--a);fill-opacity:.045;stroke:var(--a);stroke-opacity:.28;stroke-width:1}
.glabel{fill:var(--a)}
.card .bar,.card .num{fill:var(--a)}
.chip rect{fill:var(--a);fill-opacity:.1;stroke:var(--a);stroke-opacity:.3}
.chip text{fill:var(--a)}
.pill rect{fill:#ffffff;stroke:#d1d9e0}
.pill text{fill:#59636e}
.edge{fill:none;stroke-width:1.6}
.edge.grey{stroke:#afb8c1}.edge.blue{stroke:#0969da;stroke-opacity:.55}.edge.orange{stroke:#bc4c00;stroke-opacity:.6}
.edge.green{stroke:#1a7f37;stroke-opacity:.6}.edge.amber{stroke:#9a6700;stroke-opacity:.6;stroke-dasharray:5 5}
.edge.dotted{stroke-dasharray:2 5}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 13;animation:flow 1.1s linear infinite}
.flow.grey{stroke:#818b98}.flow.blue{stroke:#0969da}.flow.orange{stroke:#bc4c00}.flow.green{stroke:#1a7f37}
.flow.amber{stroke:#bf8700;animation-duration:1.6s}
.ah.grey{fill:#afb8c1}.ah.blue{fill:#0969da}.ah.orange{fill:#bc4c00}.ah.green{fill:#1a7f37}.ah.amber{fill:#9a6700}
@keyframes flow{to{stroke-dashoffset:-13.1}}
@media (prefers-reduced-motion:reduce){.flow{display:none}}
@media (prefers-color-scheme:dark){
 .title{fill:#f0f6fc}.desc{fill:#9198a1}.meta,.gmeta{fill:#6e7681}
 .cbg{fill:#151b23;stroke:#3d444d;filter:none}
 .phone{--a:#4493f8}.server{--a:#f0883e}.rules{--a:#ab7df8}.result{--a:#3fb950}
 .pass{--a:#3fb950}.fail{--a:#f85149}.unsure{--a:#d29922}
 .group rect{fill-opacity:.06;stroke-opacity:.35}
 .chip rect{fill-opacity:.14;stroke-opacity:.4}
 .pill rect{fill:#151b23;stroke:#3d444d}.pill text{fill:#9198a1}
 .edge.grey{stroke:#3d444d}.edge.blue{stroke:#4493f8}.edge.orange{stroke:#f0883e}.edge.green{stroke:#3fb950}.edge.amber{stroke:#d29922}
 .flow.grey{stroke:#9198a1}.flow.blue{stroke:#79c0ff}.flow.orange{stroke:#ffa657}.flow.green{stroke:#56d364}.flow.amber{stroke:#e3b341}
 .ah.grey{fill:#3d444d}.ah.blue{fill:#4493f8}.ah.orange{fill:#f0883e}.ah.green{fill:#3fb950}.ah.amber{fill:#d29922}
}
</style>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity=".08"/></filter>
<marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah grey"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah blue"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah orange"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah green"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah amber"/></marker></defs>
<g class="group phone"><rect x="20" y="16" width="744" height="362" rx="18"/><text x="42" y="42" class="glabel">IPHONE APP</text><text x="146" y="42" class="gmeta mono">Swift · ARKit · RealityKit</text></g>
<g class="group server"><rect x="20" y="456" width="744" height="256" rx="18"/><text x="42" y="482" class="glabel">SERVER</text><text x="109" y="482" class="gmeta mono">Python</text></g>
<g class="group result"><rect x="20" y="752" width="744" height="154" rx="18"/><text x="42" y="778" class="glabel">BACK ON THE PHONE</text><text x="210" y="778" class="gmeta mono">RealityKit</text></g>
<path d="M258 129 H283" class="edge grey" marker-end="url(#arr-grey)"/>
<path d="M258 129 H283" class="flow grey"/>
<path d="M499 129 H524" class="edge grey" marker-end="url(#arr-grey)"/>
<path d="M499 129 H524" class="flow grey"/>
<path d="M633 202 V226" class="edge grey" marker-end="url(#arr-grey)"/>
<path d="M633 202 V226" class="flow grey"/>
<path d="M520 354 V494" class="edge blue" marker-end="url(#arr-blue)"/>
<path d="M520 354 V494" class="flow blue"/>
<path d="M236 354 V494" class="edge blue dotted" marker-end="url(#arr-blue)"/>
<path d="M236 354 V494" class="flow blue dotted"/>
<path d="M266 584 H298" class="edge orange" marker-end="url(#arr-orange)"/>
<path d="M266 584 H298" class="flow orange"/>
<path d="M520 688 V790" class="edge green" marker-end="url(#arr-green)"/>
<path d="M520 688 V790" class="flow green"/>
<path d="M740 837 H792 Q816 837 816 813 V52 Q816 36 800 36 H408 Q392 36 392 52 V54" class="edge amber" marker-end="url(#arr-amber)"/>
<path d="M740 837 H792 Q816 837 816 813 V52 Q816 36 800 36 H408 Q392 36 392 52 V54" class="flow amber"/>
<g class="card phone">
<rect class="cbg" x="44" y="56" width="214" height="146" rx="12"/>
<rect class="bar" x="44" y="70" width="3" height="118" rx="1.5"/>
<text x="66" y="86" class="num mono">01</text>
<text x="90" y="86" class="title">Find the meter</text>
<text x="66" y="110" class="desc">The phone snaps the meter</text>
<text x="66" y="129" class="desc">and reads its number. AR</text>
<text x="66" y="148" class="desc">is anchored to it, and all</text>
<text x="66" y="167" class="desc">distances count from it.</text>
</g>
<g class="card phone">
<rect class="cbg" x="285" y="56" width="214" height="146" rx="12"/>
<rect class="bar" x="285" y="70" width="3" height="118" rx="1.5"/>
<text x="307" y="86" class="num mono">02</text>
<text x="331" y="86" class="title">Walk the wall</text>
<text x="307" y="110" class="desc">ARKit tracks the phone as</text>
<text x="307" y="129" class="desc">you walk. Haze lifts where</text>
<text x="307" y="148" class="desc">the camera has seen, and</text>
<text x="307" y="167" class="desc">the app asks for the rest.</text>
</g>
<g class="card phone">
<rect class="cbg" x="526" y="56" width="214" height="146" rx="12"/>
<rect class="bar" x="526" y="70" width="3" height="118" rx="1.5"/>
<text x="548" y="86" class="num mono">03</text>
<text x="572" y="86" class="title">Mark what's near</text>
<text x="548" y="110" class="desc">Tap gas meters, doors,</text>
<text x="548" y="129" class="desc">windows and AC units as</text>
<text x="548" y="148" class="desc">you pass. Then say what</text>
<text x="548" y="167" class="desc">the ground is and which</text>
<text x="548" y="186" class="desc">windows open.</text>
</g>
<g class="card phone">
<rect class="cbg" x="44" y="228" width="696" height="126" rx="12"/>
<rect class="bar" x="44" y="242" width="3" height="98" rx="1.5"/>
<text x="66" y="258" class="num mono">04</text>
<text x="90" y="258" class="title">Send the capture</text>
<text x="722" y="258" class="meta mono" text-anchor="end">ios/</text>
<text x="66" y="282" class="desc">The phone's measurements go up as scene.json. The full packet follows on request:</text>
</g>
<g class="chip phone"><rect x="66" y="292" width="86" height="22" rx="6"/><text x="75" y="307" class="mono">scene.json</text></g>
<g class="chip phone"><rect x="160" y="292" width="119" height="22" rx="6"/><text x="168" y="307" class="mono">keyframe photos</text></g>
<g class="chip phone"><rect x="287" y="292" width="52" height="22" rx="6"/><text x="296" y="307" class="mono">poses</text></g>
<g class="chip phone"><rect x="346" y="292" width="86" height="22" rx="6"/><text x="356" y="307" class="mono">intrinsics</text></g>
<g class="chip phone"><rect x="440" y="292" width="92" height="22" rx="6"/><text x="449" y="307" class="mono">motion data</text></g>
<g class="chip phone"><rect x="66" y="320" width="173" height="22" rx="6"/><text x="75" y="335" class="mono">LiDAR depth, if present</text></g>
<g class="chip phone"><rect x="247" y="320" width="119" height="22" rx="6"/><text x="256" y="335" class="mono">homeowner marks</text></g>
<g class="card server">
<rect class="cbg" x="44" y="496" width="222" height="176" rx="12"/>
<rect class="bar" x="44" y="510" width="3" height="148" rx="1.5"/>
<text x="66" y="526" class="num mono">05</text>
<text x="90" y="526" class="title">Rebuild the wall</text>
<text x="66" y="550" class="desc">From the full packet, MoGe-2</text>
<text x="66" y="569" class="desc">depth scaled with the ARKit</text>
<text x="66" y="588" class="desc">poses, or LiDAR. Fits the</text>
<text x="66" y="607" class="desc">wall and ground, and records</text>
<text x="66" y="626" class="desc">what was really seen.</text>
</g>
<g class="chip server"><rect x="66" y="638" width="153" height="22" rx="6"/><text x="75" y="653" class="mono">→ rebuilt scene.json</text></g>
<g class="card rules">
<rect class="cbg" x="300" y="496" width="440" height="192" rx="12"/>
<rect class="bar" x="300" y="510" width="3" height="164" rx="1.5"/>
<text x="322" y="526" class="num mono">06</text>
<text x="346" y="526" class="title">Check every spot</text>
<text x="722" y="526" class="meta mono" text-anchor="end">server/ · FastAPI</text>
</g>
<g class="chip rules"><rect x="322" y="540" width="146" height="22" rx="6"/><text x="331" y="555" class="mono">POST /v1/placements</text></g>
<text x="322" y="584" class="desc">Slides the 31 × 22 in battery along every stretch of</text>
<text x="322" y="603" class="desc">wall the scan saw and runs 13 checks at each spot.</text>
<text x="322" y="622" class="desc">Each value comes from rules.yaml, with its source.</text>
<text x="322" y="641" class="desc">A check passes only when its margin beats the error.</text>
<g class="chip pass"><rect x="322" y="654" width="45" height="22" rx="6"/><text x="331" y="669" class="mono">PASS</text></g>
<g class="chip fail"><rect x="375" y="654" width="45" height="22" rx="6"/><text x="384" y="669" class="mono">FAIL</text></g>
<g class="chip unsure"><rect x="428" y="654" width="58" height="22" rx="6"/><text x="437" y="669" class="mono">UNSURE</text></g>
<g class="card result">
<rect class="cbg" x="44" y="792" width="696" height="90" rx="12"/>
<rect class="bar" x="44" y="806" width="3" height="62" rx="1.5"/>
<text x="66" y="822" class="num mono">07</text>
<text x="90" y="822" class="title">See the spot in AR</text>
<text x="722" y="822" class="meta mono" text-anchor="end">ios/</text>
<text x="66" y="846" class="desc">The best spot appears on the wall, pinned to the meter's anchor, with each check's reason.</text>
<text x="66" y="865" class="desc">An UNSURE check names the view that would settle it. An installer reviews every result.</text>
</g>
<g class="pill"><rect x="476.2" y="407" width="88" height="22" rx="11"/><text x="520" y="422" class="mono" text-anchor="middle">scene.json</text></g>
<g class="pill"><rect x="188.9" y="407" width="94" height="22" rx="11"/><text x="236" y="422" class="mono" text-anchor="middle">full packet</text></g>
<g class="pill"><rect x="412.1" y="721" width="216" height="22" rx="11"/><text x="520" y="736" class="mono" text-anchor="middle">a spot, or the views it needs</text></g>
<g class="pill" transform="rotate(-90 836 460)"><rect x="751.8" y="449" width="168" height="22" rx="11"/><text x="836" y="464" class="mono" text-anchor="middle">UNSURE → one more view</text></g>
</svg>
