<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 944" width="880" height="944" role="img" aria-labelledby="t d">
<title id="t">House scanning architecture</title>
<desc id="d">The iPhone app guides a walk and builds a capture packet. It posts scene.json to the placement API, and sends photos and poses to the reconstruction worker, which posts a rebuilt scene.json to the same API. The rules engine checks every spot along the wall and returns PASS, FAIL or UNSURE. The result shows in AR, pinned to the meter. An UNSURE check sends the homeowner back for one more view.</desc>
<defs><style>
.title,.desc,.glabel{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11.5px}
.title{font-size:16px;font-weight:600;fill:#1f2328}
.desc{font-size:13px;fill:#59636e}
.meta,.gmeta{fill:#818b98}
.num{font-weight:700;font-size:12px}
.glabel{font-size:11.5px;font-weight:700;letter-spacing:.12em}
.cbg{fill:#ffffff;stroke:#d1d9e0;stroke-width:1;filter:url(#shadow)}
.phone{--a:#0969da}.server{--a:#bc4c00}.rules{--a:#8250df}.result{--a:#1a7f37}
.pass{--a:#1a7f37}.fail{--a:#cf222e}.unsure{--a:#9a6700}
.group rect{fill:var(--a);fill-opacity:.045;stroke:var(--a);stroke-opacity:.28;stroke-width:1}
.glabel{fill:var(--a)}
.card .bar,.card .num{fill:var(--a)}
.chip rect{fill:var(--a);fill-opacity:.1;stroke:var(--a);stroke-opacity:.3}
.chip text{fill:var(--a)}
.pill rect{fill:#ffffff;stroke:#d1d9e0}
.pill text{fill:#59636e}
.edge{fill:none;stroke-width:1.6}
.edge.grey{stroke:#afb8c1}.edge.blue{stroke:#0969da;stroke-opacity:.55}.edge.orange{stroke:#bc4c00;stroke-opacity:.6}
.edge.green{stroke:#1a7f37;stroke-opacity:.6}.edge.amber{stroke:#9a6700;stroke-opacity:.6;stroke-dasharray:5 5}
.edge.dotted{stroke-dasharray:2 5}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 13;animation:flow 1.1s linear infinite}
.flow.grey{stroke:#818b98}.flow.blue{stroke:#0969da}.flow.orange{stroke:#bc4c00}.flow.green{stroke:#1a7f37}
.flow.amber{stroke:#bf8700;animation-duration:1.6s}
.ah.grey{fill:#afb8c1}.ah.blue{fill:#0969da}.ah.orange{fill:#bc4c00}.ah.green{fill:#1a7f37}.ah.amber{fill:#9a6700}
@keyframes flow{to{stroke-dashoffset:-13.1}}
@media (prefers-reduced-motion:reduce){.flow{display:none}}
@media (prefers-color-scheme:dark){
 .title{fill:#f0f6fc}.desc{fill:#9198a1}.meta,.gmeta{fill:#6e7681}
 .cbg{fill:#151b23;stroke:#3d444d;filter:none}
 .phone{--a:#4493f8}.server{--a:#f0883e}.rules{--a:#ab7df8}.result{--a:#3fb950}
 .pass{--a:#3fb950}.fail{--a:#f85149}.unsure{--a:#d29922}
 .group rect{fill-opacity:.06;stroke-opacity:.35}
 .chip rect{fill-opacity:.14;stroke-opacity:.4}
 .pill rect{fill:#151b23;stroke:#3d444d}.pill text{fill:#9198a1}
 .edge.grey{stroke:#3d444d}.edge.blue{stroke:#4493f8}.edge.orange{stroke:#f0883e}.edge.green{stroke:#3fb950}.edge.amber{stroke:#d29922}
 .flow.grey{stroke:#9198a1}.flow.blue{stroke:#79c0ff}.flow.orange{stroke:#ffa657}.flow.green{stroke:#56d364}.flow.amber{stroke:#e3b341}
 .ah.grey{fill:#3d444d}.ah.blue{fill:#4493f8}.ah.orange{fill:#f0883e}.ah.green{fill:#3fb950}.ah.amber{fill:#d29922}
}
</style>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity=".08"/></filter>
<marker id="arr-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah grey"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah blue"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah orange"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah green"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" class="ah amber"/></marker></defs>
<g class="group phone"><rect x="20" y="16" width="744" height="308" rx="18"/><text x="42" y="42" class="glabel">IPHONE APP</text><text x="146" y="42" class="gmeta mono">Swift · ARKit · RealityKit</text></g>
<g class="group server"><rect x="20" y="400" width="744" height="334" rx="18"/><text x="42" y="426" class="glabel">SERVER</text><text x="109" y="426" class="gmeta mono">Python</text></g>
<g class="group result"><rect x="20" y="776" width="744" height="150" rx="18"/><text x="42" y="802" class="glabel">BACK ON THE PHONE</text><text x="210" y="802" class="gmeta mono">RealityKit</text></g>
<path d="M520 148 V172" class="edge grey" marker-end="url(#arr-grey)"/>
<path d="M520 148 V172" class="flow grey"/>
<path d="M520 300 V438" class="edge blue" marker-end="url(#arr-blue)"/>
<path d="M520 300 V438" class="flow blue"/>
<path d="M236 300 V438" class="edge blue dotted" marker-end="url(#arr-blue)"/>
<path d="M236 300 V438" class="flow blue dotted"/>
<path d="M266 493 H298" class="edge orange" marker-end="url(#arr-orange)"/>
<path d="M266 493 H298" class="flow orange"/>
<path d="M520 546 V572" class="edge grey" marker-end="url(#arr-grey)"/>
<path d="M520 546 V572" class="flow grey"/>
<path d="M520 710 V814" class="edge green" marker-end="url(#arr-green)"/>
<path d="M520 710 V814" class="flow green"/>
<path d="M740 861 H792 Q816 861 816 837 V126 Q816 102 792 102 H742" class="edge amber" marker-end="url(#arr-amber)"/>
<path d="M740 861 H792 Q816 861 816 837 V126 Q816 102 792 102 H742" class="flow amber"/>
<g class="card phone">
<rect class="cbg" x="44" y="56" width="696" height="92" rx="12"/>
<rect class="bar" x="44" y="70" width="3" height="64" rx="1.5"/>
<text x="66" y="86" class="num mono">01</text>
<text x="90" y="86" class="title">Guided walk</text>
<text x="722" y="86" class="meta mono" text-anchor="end">ios/</text>
<text x="66" y="110" class="desc">ARKit tracks the phone. The homeowner taps the meter, then marks gas meters, doors,</text>
<text x="66" y="129" class="desc">windows and AC units along the wall. Haze lifts wherever the camera has seen.</text>
</g>
<g class="card phone">
<rect class="cbg" x="44" y="174" width="696" height="126" rx="12"/>
<rect class="bar" x="44" y="188" width="3" height="98" rx="1.5"/>
<text x="66" y="204" class="num mono">02</text>
<text x="90" y="204" class="title">Capture packet</text>
<text x="722" y="204" class="meta mono" text-anchor="end">one per walk</text>
<text x="66" y="228" class="desc">Everything the rules need, from one walk:</text>
</g>
<g class="chip phone"><rect x="66" y="238" width="119" height="22" rx="6"/><text x="75" y="253" class="mono">keyframe photos</text></g>
<g class="chip phone"><rect x="193" y="238" width="52" height="22" rx="6"/><text x="202" y="253" class="mono">poses</text></g>
<g class="chip phone"><rect x="253" y="238" width="86" height="22" rx="6"/><text x="262" y="253" class="mono">intrinsics</text></g>
<g class="chip phone"><rect x="346" y="238" width="92" height="22" rx="6"/><text x="356" y="253" class="mono">motion data</text></g>
<g class="chip phone"><rect x="66" y="266" width="173" height="22" rx="6"/><text x="75" y="281" class="mono">LiDAR depth, if present</text></g>
<g class="chip phone"><rect x="247" y="266" width="119" height="22" rx="6"/><text x="256" y="281" class="mono">homeowner marks</text></g>
<g class="chip phone"><rect x="374" y="266" width="86" height="22" rx="6"/><text x="384" y="281" class="mono">scene.json</text></g>
<g class="card server">
<rect class="cbg" x="44" y="440" width="222" height="156" rx="12"/>
<rect class="bar" x="44" y="454" width="3" height="128" rx="1.5"/>
<text x="66" y="470" class="num mono">03</text>
<text x="90" y="470" class="title">Reconstruction</text>
<text x="248" y="470" class="meta mono" text-anchor="end">recon/</text>
<text x="66" y="494" class="desc">MoGe-2 depth, scaled with</text>
<text x="66" y="513" class="desc">the ARKit poses, or LiDAR.</text>
<text x="66" y="532" class="desc">Fits the wall and ground, and</text>
<text x="66" y="551" class="desc">records what was really seen.</text>
</g>
<g class="chip server"><rect x="66" y="564" width="153" height="22" rx="6"/><text x="75" y="579" class="mono">→ rebuilt scene.json</text></g>
<g class="card server">
<rect class="cbg" x="300" y="440" width="440" height="106" rx="12"/>
<rect class="bar" x="300" y="454" width="3" height="78" rx="1.5"/>
<text x="322" y="470" class="num mono">04</text>
<text x="346" y="470" class="title">Placement API</text>
<text x="722" y="470" class="meta mono" text-anchor="end">server/ · FastAPI</text>
</g>
<g class="chip server"><rect x="322" y="484" width="146" height="22" rx="6"/><text x="331" y="499" class="mono">POST /v1/placements</text></g>
<text x="322" y="530" class="desc">Also draws the wall and the chosen spot as a site plan.</text>
<g class="card rules">
<rect class="cbg" x="300" y="574" width="440" height="136" rx="12"/>
<rect class="bar" x="300" y="588" width="3" height="108" rx="1.5"/>
<text x="322" y="604" class="num mono">05</text>
<text x="346" y="604" class="title">Rules engine</text>
<text x="722" y="604" class="meta mono" text-anchor="end">rules.yaml</text>
<text x="322" y="628" class="desc">Plain code tries every spot along the wall. Each</text>
<text x="322" y="647" class="desc">clearance comes from rules.yaml with its source.</text>
<text x="322" y="666" class="desc">A check passes only when its margin beats the error.</text>
</g>
<g class="chip pass"><rect x="322" y="676" width="45" height="22" rx="6"/><text x="331" y="691" class="mono">PASS</text></g>
<g class="chip fail"><rect x="375" y="676" width="45" height="22" rx="6"/><text x="384" y="691" class="mono">FAIL</text></g>
<g class="chip unsure"><rect x="428" y="676" width="58" height="22" rx="6"/><text x="437" y="691" class="mono">UNSURE</text></g>
<g class="card result">
<rect class="cbg" x="44" y="816" width="696" height="90" rx="12"/>
<rect class="bar" x="44" y="830" width="3" height="62" rx="1.5"/>
<text x="66" y="846" class="num mono">06</text>
<text x="90" y="846" class="title">Result in AR</text>
<text x="722" y="846" class="meta mono" text-anchor="end">anchored to the meter</text>
<text x="66" y="870" class="desc">The spot, pinned to the meter's anchor so it stays put as tracking improves,</text>
<text x="66" y="889" class="desc">with each check's reason. An installer reviews every result.</text>
</g>
<g class="pill"><rect x="476.2" y="351" width="88" height="22" rx="11"/><text x="520" y="366" class="mono" text-anchor="middle">scene.json</text></g>
<g class="pill"><rect x="178.8" y="351" width="114" height="22" rx="11"/><text x="236" y="366" class="mono" text-anchor="middle">photos + poses</text></g>
<g class="pill"><rect x="412.1" y="747" width="216" height="22" rx="11"/><text x="520" y="762" class="mono" text-anchor="middle">a spot, or the views it needs</text></g>
<g class="pill" transform="rotate(-90 836 480)"><rect x="751.8" y="469" width="168" height="22" rx="11"/><text x="836" y="484" class="mono" text-anchor="middle">UNSURE → one more view</text></g>
</svg>
