[project]
name = "panel-label"
version = "0.1.0"
description = "Whether on-device text recognition reads residential panel labels: manufacturer, model and main breaker amperage"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_eval"]

[tool.uv]
required-version = ">=0.11.15,<0.12"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
