[project]
name = "house-scanning-scoring"
version = "0.1.0"
description = "Scores capture pipelines against an independent tape survey of the same house"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
score = "scoring.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# setup-uv reads this in CI, so local and CI runs use the same uv minor version as uv.lock.
required-version = ">=0.11.15,<0.12"

[tool.uv.build-backend]
module-name = "scoring"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
