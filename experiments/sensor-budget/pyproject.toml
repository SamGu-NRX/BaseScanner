[project]
name = "sensor-budget"
version = "0.1.0"
description = "Physics error budgets for phone signals that no dataset on disk can test"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
