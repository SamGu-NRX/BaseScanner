[project]
name = "autodetect"
version = "0.1.0"
description = "Evaluation of on-device window and door detection for the house-scanning app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "onnxruntime>=1.22",
    "tokenizers>=0.21",
    "onnx>=1.23.0",
    "torch==2.14.0",
    "transformers>=5.17.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
