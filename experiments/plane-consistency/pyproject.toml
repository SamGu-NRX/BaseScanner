[project]
name = "plane-consistency"
version = "0.1.0"
description = "Can two photos, compared through the wall plane, show that something stands in front of the wall?"
requires-python = ">=3.12"
# The evals harness is imported read-only from its own worktree (see run.py), so these match its
# dependencies.
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
