[project]
name = "house-scanning-evals"
version = "0.1.0"
description = "Real-data accuracy evals: ADVIO tracking drift and ETH3D wall reconstruction"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "py7zr>=1.1.3",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Modules run in place; nothing to build or install.
package = false
# setup-uv reads this in CI, so local and CI runs use the same uv minor version as uv.lock.
required-version = ">=0.11.15,<0.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter wraps code; long prose strings and docstrings stay on one line.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
