# Source of truth for HouseScan.xcodeproj. After editing, run `make ios-project` from the repo root
# and commit the regenerated project; CI fails if the committed project differs.
name: HouseScan

options:
  # CI installs this exact version; older releases write a different project file.
  minimumXcodeGenVersion: 2.46.0
  # Written into the project and scheme as LastUpgradeCheck, so Xcode 26 does not offer
  # a settings upgrade that would edit the generated file.
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

# Integration Debug and Integration Release build the same app under its own identity for the
# capture API test build (Config/Integration.xcconfig).
configs:
  Debug: debug
  Release: release
  Integration Debug: debug
  Integration Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES

packages:
  # The capture logic, a local Swift package that builds and tests on macOS (`swift test`).
  HouseScanKit:
    path: HouseScanKit

targets:
  HouseScan:
    type: application
    platform: iOS
    sources:
      # Synchronized folder: Xcode picks up files added to HouseScan/ without project-file edits.
      - path: HouseScan
        type: syncedFolder
      - path: Config/Info.plist
        buildPhase: none
    dependencies:
      - package: HouseScanKit
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
      Integration Debug: Config/Integration.xcconfig
      Integration Release: Config/Integration.xcconfig
    settings:
      base:
        PRODUCT_NAME: HouseScan
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).housescan$(BUNDLE_ID_SUFFIX)
        INFOPLIST_FILE: Config/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Runs the whole flow in the Simulator from a recorded session, driven by the app's autopilot.
  HouseScanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # Fixtures stay out of the bundle: the tests read them at their source paths, and the two
      # replays' same-named files (session.json, keyframes/k000NN.jpg) would collide in its one
      # flat resources folder ("Multiple commands produce").
      - path: HouseScanUITests
        type: syncedFolder
        excludes:
          - Fixtures
      # The capture API stand-in the package tests use, reused as the integration UI tests'
      # local receiver (IntegrationUITests).
      - path: HouseScanKit/Tests/HouseScanKitTests/LoopbackCaptureAPI.swift
    dependencies:
      - target: HouseScan
      - package: HouseScanKit
    settings:
      base:
        # The integration build's runner has its own id too, so neither install replaces the other's.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).housescan$(BUNDLE_ID_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HouseScan
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
      Integration Debug: Config/Integration.xcconfig
      Integration Release: Config/Integration.xcconfig

schemes:
  HouseScan:
    build:
      targets:
        HouseScan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HouseScanUITests
    archive:
      config: Release
  # The capture API test build: same sources, its own bundle id and name, so it installs beside
  # the client beta.
  HouseScan Integration:
    build:
      targets:
        HouseScan: all
    run:
      config: Integration Debug
    test:
      config: Integration Debug
      targets:
        - HouseScanUITests
    profile:
      config: Integration Release
    analyze:
      config: Integration Debug
    archive:
      config: Integration Release
